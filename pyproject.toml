[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hoodgrow"
version = "0.15.0"
description = "Python SDK for the HoodGrow Robinhood Chain (and Base B20) stock token API — live price, corporate-action adjusted supply, DeFi depth (Morpho/Uniswap), and corporate actions. Pay per call via x402 (USDC on Base) or a bearer API key."
readme = "README.md"
# 3.10 floor is real, not cautious: models.py builds runtime PEP 604 unions
# (e.g. `Literal[...] | None` in an assignment), which `from __future__
# import annotations` cannot rescue — on 3.9 `import hoodgrow` raises
# TypeError at import time.
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HoodGrow" }]
keywords = [
  "hoodgrow",
  "x402",
  "robinhood-chain",
  "stock-tokens",
  "tokenized-equities",
  "defi",
  "morpho",
  "uniswap",
  "agent",
  "ai-agent",
  "langchain",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "requests>=2.31.0",
  "pydantic>=2.0.0",
  "x402[requests,evm]>=2.17.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "responses>=0.25.0"]

[project.urls]
Homepage = "https://www.hoodgrow.com"
Documentation = "https://www.hoodgrow.com/api-access"
Repository = "https://github.com/MeMikko/hoodgrow-py"
Issues = "https://github.com/MeMikko/hoodgrow-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hoodgrow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
